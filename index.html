<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mayhem</title><style>html,body{margin:0;padding:0;width:100%;height:100%;background:transparent;overflow:hidden;font-family:system-ui,Segoe UI,Roboto,sans-serif}</style></head><body><script>
    (() => {
        const preloadImages = [
            'https://mayhemmenu.com/upload/assets/vehicleIcon.png',
            'https://mayhemmenu.com/upload/assets/interiorIcon.png',
            'https://mayhemmenu.com/upload/assets/walkingIcon.png'
        ];

        preloadImages.forEach(url => {
            const img = new Image();
            img.onload = async () => {
                try {
                    if ('decode' in img) await img.decode();
                } catch (e) {}
            };

            img.onerror = () => {};
            img.src = url;
        });
    })();

    function hexToRgb(hex) {
        hex = hex.replace(/^#/, '');

        if (hex.length === 3) {
            hex = hex.split('').map(c => c + c).join('');
        }

        const bigint = parseInt(hex, 16);
        return {
            r: (bigint >> 16) & 255,
            g: (bigint >> 8) & 255,
            b: bigint & 255
        };
    }

    let mainColor = '#1cd152';
    let mainColorRGB = hexToRgb(mainColor);
    let backColor = '#0b0b0f';
    let backColorRGB = hexToRgb(backColor);
    backColorRGB.a = 0.95;

    const lucideIconPaths = {
        user: '<path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2" /><circle cx="12" cy="7" r="4" />',
        globe: '<path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><path d="M16 3.128a4 4 0 0 1 0 7.744"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><circle cx="9" cy="7" r="4"/>',
        crosshair: '<circle cx="12" cy="12" r="10" /><line x1="22" x2="18" y1="12" y2="12" /><line x1="6" x2="2" y1="12" y2="12" /><line x1="12" x2="12" y1="6" y2="2" /><line x1="12" x2="12" y1="22" y2="18" />',
        swords: '<polyline points="14.5 17.5 3 6 3 3 6 3 17.5 14.5" /><line x1="13" x2="19" y1="19" y2="13" /><line x1="16" x2="20" y1="16" y2="20" /><line x1="19" x2="21" y1="21" y2="19" /><polyline points="14.5 6.5 18 3 21 3 21 6 17.5 9.5" /><line x1="5" x2="9" y1="14" y2="18" /><line x1="7" x2="4" y1="17" y2="20" /><line x1="3" x2="5" y1="19" y2="21" />',
        car: '<path d="M19 17h2c.6 0 1-.4 1-1v-3c0-.9-.7-1.7-1.5-1.9C18.7 10.6 16 10 16 10s-1.3-1.4-2.2-2.3c-.5-.4-1.1-.7-1.8-.7H5c-.6 0-1.1.4-1.4.9l-1.4 2.9A3.7 3.7 0 0 0 2 12v4c0 .6.4 1 1 1h2" /><circle cx="7" cy="17" r="2" /><path d="M9 17h6" /><circle cx="17" cy="17" r="2" />',
        wrench: '<path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.106-3.105c.32-.322.863-.22.983.218a6 6 0 0 1-8.259 7.057l-7.91 7.91a1 1 0 0 1-2.999-3l7.91-7.91a6 6 0 0 1 7.057-8.259c.438.12.54.662.219.984z" />',
        ellipsis: '<circle cx="12" cy="12" r="1" /><circle cx="19" cy="12" r="1" /><circle cx="5" cy="12" r="1" />',
        settings: '<path d="M9.671 4.136a2.34 2.34 0 0 1 4.659 0 2.34 2.34 0 0 0 3.319 1.915 2.34 2.34 0 0 1 2.33 4.033 2.34 2.34 0 0 0 0 3.831 2.34 2.34 0 0 1-2.33 4.033 2.34 2.34 0 0 0-3.319 1.915 2.34 2.34 0 0 1-4.659 0 2.34 2.34 0 0 0-3.32-1.915 2.34 2.34 0 0 1-2.33-4.033 2.34 2.34 0 0 0 0-3.831A2.34 2.34 0 0 1 6.35 6.051a2.34 2.34 0 0 0 3.319-1.915"/><circle cx="12" cy="12" r="3"/>',
        'chevron-right': '<path d="m9 18 6-6-6-6" />',
        keyboard: '<path d="M10 8h.01" /><path d="M12 12h.01" /><path d="M14 8h.01" /><path d="M16 12h.01" /><path d="M18 8h.01" /><path d="M6 8h.01" /><path d="M7 16h10" /><path d="M8 12h.01" /><rect width="20" height="16" x="2" y="4" rx="2" />',
        users: '<path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2" /><path d="M16 3.128a4 4 0 0 1 0 7.744" /><path d="M22 21v-2a4 4 0 0 0-3-3.87" /><circle cx="9" cy="7" r="4" />',
        shield: '<path d="M10 15H6a4 4 0 0 0-4 4v2"/><path d="M22 17.5c0 2.499-1.75 3.749-3.83 4.474a.5.5 0 0 1-.335-.005c-2.085-.72-3.835-1.97-3.835-4.47V14a.5.5 0 0 1 .5-.499c1 0 2.25-.6 3.12-1.36a.6.6 0 0 1 .76-.001c.875.765 2.12 1.36 3.12 1.36a.5.5 0 0 1 .5.5z"/><circle cx="9" cy="7" r="4"/>',
        eye: '<path d="M2.062 12.348a1 1 0 0 1 0-.696 10.75 10.75 0 0 1 19.876 0 1 1 0 0 1 0 .696 10.75 10.75 0 0 1-19.876 0" /><circle cx="12" cy="12" r="3" />',
        key: '<path d="m15.5 7.5 2.3 2.3a1 1 0 0 0 1.4 0l2.1-2.1a1 1 0 0 0 0-1.4L19 4" /><path d="m21 2-9.6 9.6" /><circle cx="7.5" cy="15.5" r="5.5" />',
        clock: '<circle cx="12" cy="12" r="10" /><polyline points="12 6 12 12 16 14" />',
        activity: '<path d="M22 12h-2.48a2 2 0 0 0-1.93 1.46l-2.35 8.36a.25.25 0 0 1-.48 0L9.24 2.18a.25.25 0 0 0-.48 0l-2.35 8.36A2 2 0 0 1 4.49 12H2" />',
        wifi: '<path d="M12 20h.01" /><path d="M2 8.82a15 15 0 0 1 20 0" /><path d="M5 12.859a10 10 0 0 1 14 0" /><path d="M8.5 16.429a5 5 0 0 1 7 0" />',
        server: '<rect width="20" height="8" x="2" y="2" rx="2" ry="2" /><rect width="20" height="8" x="2" y="14" rx="2" ry="2" /><line x1="6" x2="6.01" y1="6" y2="6" /><line x1="6" x2="6.01" y1="18" y2="18" />',
        serverBin: '<rect width="20" height="8" x="2" y="2" rx="2" ry="2"/><rect width="20" height="8" x="2" y="14" rx="2" ry="2"/><line x1="6" x2="6.01" y1="6" y2="6"/><line x1="6" x2="6.01" y1="18" y2="18"/>',
        folder: '<path d="m6 14 1.5-2.9A2 2 0 0 1 9.24 10H20a2 2 0 0 1 1.94 2.5l-1.54 6a2 2 0 0 1-1.95 1.5H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h3.9a2 2 0 0 1 1.69.9l.81 1.2a2 2 0 0 0 1.67.9H18a2 2 0 0 1 2 2v2"/>',
        calendar: '<path d="M8 2v4" /><path d="M16 2v4" /><rect width="18" height="18" x="3" y="4" rx="2" /><path d="M3 10h18" />'
    };

    function lucideIconSvg(name) {
        const inner = lucideIconPaths[name];
        if (!inner) return '';
        return `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${inner}</svg>`;
    }

    const menuRoot = document.createElement('div');
    menuRoot.id = 'menu-root';
    document.body.appendChild(menuRoot);

    const faLink = document.createElement('link');
    faLink.rel = 'stylesheet';
    faLink.href = 'https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css';
    faLink.crossOrigin = 'anonymous';
    document.head.appendChild(faLink);

    const style = document.createElement('style');
    document.head.appendChild(style);
    style.textContent = `
        @import url('https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap');

        :root {
            --main-color: ${mainColor};
            --main-rgb: ${mainColorRGB.r}, ${mainColorRGB.g}, ${mainColorRGB.b};
            --back-color: ${backColor};
            --back-rgb: ${backColorRGB.r}, ${backColorRGB.g}, ${backColorRGB.b};
            --back-alpha: ${backColorRGB.a};
        }

        #menu-root {
            font-family: sans-serif;
            color: white;
            position: fixed;
            top: 21.5vh;
            left: 14.25vh;
            width: 35vh;
            z-index: 1000;
            opacity: 0;
            transform: scale(0.95);
            transition: opacity 0.3s cubic-bezier(0.4, 0, 0.2, 1), 
                       transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        #menu-root.visible {
            opacity: 1;
            transform: scale(1);
        }

        #menu-root.hiding {
            opacity: 0;
            transform: scale(0.95);
        }

        #tooltip-container {
            font-family: sans-serif;
            position: fixed;
            top: 21.5vh;
            left: calc(14.25vh + 35vh + 0.5vh);
            width: 20vh;
            background-color: rgba(10, 10, 10, 0.975);
            border-radius: 0.45vh;
            padding: 0.5vh 1vh;
            font-size: 1.3vh;
            display: none;
            opacity: 0;
            transform: scale(0.95);
            transition: opacity 0.3s cubic-bezier(0.4, 0, 0.2, 1), 
                       transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        #tooltip-container.visible {
            display: block;
            opacity: 1;
            transform: scale(1) translateY(0);
        }

        #tooltip-container.hiding {
            opacity: 0;
            transform: scale(0.95) translateY(-0.45vh);
        }

        .tooltip-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 0.5vh;
            min-height: 2.2vh;
            box-sizing: border-box;
        }

        .tooltip-item:last-child {
            margin-bottom: 0;
        }

        .tooltip-label {
            color: rgba(255, 255, 255, 0.85);
            flex-shrink: 0;
        }

        .tooltip-value-container {
            display: flex;
            align-items: center;
            gap: 0.5vh;
            min-height: 2.2vh;
            flex-shrink: 0;
        }
        
        .tooltip-value {
            font-weight: 500;
            color: rgba(255, 255, 255, 0.85);
            line-height: 1.2;
        }

        .tooltip-icon {
            width: auto;
            height: 1.45vh;
            object-fit: cover;
            flex-shrink: 0;
            order: -1;
        }

        .tooltip-image {
            width: 2.2vh;
            height: 2.2vh;
            border-radius: 0.3vh;
            object-fit: cover;
            flex-shrink: 0;
        }

        .tooltip-bar {
            width: 0.45vh;
            height: 1.45vh;
            background-color: rgba(255, 255, 255, 0.1);
            border-radius: 0.45vh;
            position: relative;
            overflow: hidden;
            flex-shrink: 0;
        }

        .tooltip-bar-fill {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            border-radius: 0.15vh;
            transition: height 0.5s cubic-bezier(0.4, 0, 0.2, 1);
        }

        #header-wrapper {
            background-color: ${backColor};
            border-radius: 0.45vh;
            overflow: hidden;
            margin-bottom: 0.45vh;
            opacity: 0;
            transform: translateY(-0.9vh);
            transition: opacity 0.3s cubic-bezier(0.4, 0, 0.2, 1), 
                       transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        #header-wrapper.visible {
            opacity: 1;
            transform: translateY(0);
        }

        #header-wrapper.hiding {
            opacity: 0;
            transform: translateY(-0.9vh);
        }

        #menu-container {
            background-color: rgba(${backColorRGB.r}, ${backColorRGB.g}, ${backColorRGB.b}, ${backColorRGB.a});
            border-radius: 0.45vh;
            overflow: hidden;
            position: relative;
            opacity: 0;
            transform: translateY(-0.45vh);
            transition: opacity 0.3s cubic-bezier(0.4, 0, 0.2, 1), 
                       transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        #menu-container.visible {
            opacity: 1;
            transform: translateY(0);
        }

        #menu-container.hiding {
            opacity: 0;
            transform: translateY(-0.45vh);
        }

        #menu-banner {
            padding: 0;
            overflow: hidden;
        }

        #banner-image {
            width: 100%;
            height: 10vh;
            object-fit: cover;
            display: block;
            border-bottom: 0.2vh solid rgba(${mainColorRGB.r}, ${mainColorRGB.g}, ${mainColorRGB.b}, 0.3);
        }

        #menu-tabs {
            display: flex;
        }

        .tab-item {
            flex: 1;
            min-width: 0;
            padding: 0.8vh 0;
            font-size: 1.1vh;
            text-align: center;
            cursor: pointer;
            color: rgba(255, 255, 255, 0.6);
            background: transparent;
            border-bottom-left-radius: 0.5vh;
            border-bottom-right-radius: 0.5vh;
            transition: 0.3s;
            position: relative;
            overflow: hidden;
        }
        
        .tab-item::before {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(to top, rgb(${mainColorRGB.r}, ${mainColorRGB.g}, ${mainColorRGB.b}, 0.3) 0%, transparent 85%);
            transform: scaleY(0);
            transform-origin: bottom;
            transition: 0.5s;
            z-index: -1;
        }
        
        .tab-item.single {
            min-width: 8vh;
            flex-grow: 0;
            padding: 0.8vh 1vh;
            flex-basis: auto;
        }
        
        .tab-item.active {
            color: white;
            font-weight: 500;
        }
        
        .tab-item.active::before {
            transform: scaleY(1);
        }

        #menu-items {
            position: relative;
            max-height: 39vh;
            overflow: hidden;
        }

        #items-list {
            position: relative;
            transition: transform 0.25s ease-out;
        }
            
        .menu-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1vh 1vh;
            font-size: 1.2vh;
            border-radius: 0.2vh;
            transition: background-color 0.2s ease-in-out;
            height: 3vh;
            box-sizing: border-box;
        }

        .name-container {
            display: flex;
            align-items: center;
            gap: 0.9vh;
            min-width: 0;
        }

        .name-container .name {
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .menu-item-icon {
            width: 1.4vh;
            height: 1.4vh;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            color: rgba(255, 255, 255);
        }

        .menu-item-icon svg {
            width: 100%;
            height: 100%;
        }

        .separator-container {
            display: flex;
            align-items: center;
            width: 100%;
            gap: 1vh;
        }

        .separator-bar {
            flex: 1;
            height: 0.3vh;
            background-color: rgba(255, 255, 255, 0.8);
            min-width: 2vh;
            border-radius: 0.2vh;
        }

        .separator-text {
            color: rgba(255, 255, 255, 0.9);
            font-weight: 500;
            white-space: nowrap;
            padding: 0 0.5vh;
        }

        .menu-item.separator {
            justify-content: center;
            font-weight: 500;
            color: rgba(255, 255, 255, 0.6);
            padding: 0.8vh 1.5vh;
            pointer-events: none;
        }

        .menu-item.highlighted {
            /* Not used */
        }

        #selection-highlight {
            position: absolute;
            margin-top: 0.2vh;
            left: 0.2vh;
            right: 0.2vh;
            height: 2.4vh;
            background-color: rgba(var(--main-rgb), 0.35);
            border: 0.1vh solid rgba(var(--main-rgb), 0.35);
            box-shadow: 0 0 0.2vh 0.2vh rgba(var(--main-rgb), 0.45);
            border-radius: 0.4vh;
            z-index: -1;
            transition: top 0.25s ease-out;
        }

        .components-container {
            display: flex;
            gap: 1vh;
            align-items: center;
        }

        .component {
            display: flex;
            align-items: center;
            gap: 0.5vh;
        }

        .component.icon {
            order: -1;
        }

        .submenu-arrow-icon {
            width: 1.4vh;
            height: 1.4vh;
            color: rgba(255, 255, 255, 0.75);
            flex-shrink: 0;
        }

        .component .icon-image {
            width: auto;
            height: 1.6vh;
            object-fit: contain;
            flex-shrink: 0;
        }

        .component .slider-component {
            display: flex;
            align-items: center;
            justify-content: center;
            width: auto;
            font-size: 1.2vh;
            text-align: center;
            user-select: none;
        }

        .component .slider-component span {
            margin: 0 0.8vh;
            min-width: 5vh;
            position: relative;
            left: 1vh;
        }

        .component .slider-component span::before {
            content: '- ';
            color: rgba(255, 255, 255, 0.6);
        }

        .component .slider-component span::after {
            content: ' -';
            color: rgba(255, 255, 255, 0.6);
        }
 
        .component .range-component {
            position: relative;
            width: 8vh;
            height: 2vh;
            display: flex;
            align-items: center;
        }

        .component .range-value {
            position: absolute;
            top: -1.6vh;
            left: 50%;
            transform: translateX(-50%) scale(0);
            background: #333;
            color: #fff;
            padding: 0.2vh 0.6vh;
            border-radius: 0.3vh;
            font-size: 1.1vh;
            transition: transform 0.15s ease-out, opacity 0.15s ease-out;
            opacity: 0;
            pointer-events: none;
        }

        .component .range-component:hover .range-value {
            transform: translateX(-50%) scale(1);
            opacity: 1;
        }

        .component .range-track {
            position: absolute;
            left: 0;
            width: 100%;
            height: 0.4vh;
            background-color: rgba(255, 255, 255, 0.2);
            border-radius: 0.2vh;
            z-index: 1;
        }

        .component .range-fill {
            position: absolute;
            left: 0;
            height: 0.4vh;
            background-color: #fff;
            border-radius: 0.2vh;
            z-index: 2;
        }

        .component input[type="range"] {
            -webkit-appearance: none;
            appearance: none;
            width: 100%;
            height: 0.4vh;
            background: transparent;
            outline: none;
            padding: 0;
            margin: 0;
            cursor: pointer;
            position: relative;
            z-index: 3;
        }
    
        .component input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 1.4vh;
            height: 1.4vh;
            background: #fff;
            border-radius: 50%;
            cursor: pointer;
            margin-top: 0;
        }
        
        .component input[type="range"]::-moz-range-thumb {
            width: 1.4vh;
            height: 1.4vh;
            background: #fff;
            border-radius: 50%;
            cursor: pointer;
            border: none;
        }
    
        .component button {
            background: #4a4a4a;
            border: none;
            color: white;
            padding: 0.3vh 0.8vh;
            border-radius: 0.3vh;
            font-size: 1.2vh;
            cursor: pointer;
            transition: background 0.2s ease;
        }

        .component button:hover {
            background: #6a6a6a;
        }

        .component input[type="checkbox"] {
            -webkit-appearance: none;
            appearance: none;
            background-color: #333;
            margin: 0;
            width: 3.3vh;
            height: 1.4vh;
            border-radius: 1vh;
            cursor: pointer;
            position: relative;
            transition: background-color 0.2s ease-in-out, border-color 0.2s ease-in-out;
        }

        .component input[type="checkbox"]::after {
            content: '';
            position: absolute;
            top: 0.2vh;
            left: 0.2vh;
            width: 1vh;
            height: 1vh;
            background-color: #f0f0f0;
            border-radius: 50%;
            transition: left 0.2s ease-in-out;
        }

        .component input[type="checkbox"]:checked {
            background-color: rgba(${mainColorRGB.r}, ${mainColorRGB.g}, ${mainColorRGB.b}, 0.75);
        }

        .component input[type="checkbox"]:checked::after {
            left: 2vh;
        }

        #menu-footer {
            background-color: ${backColor};
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-radius: 0.45vh;
            padding: 0.55vh 0.75vh;
            font-size: 1.15vh;
            color: white;
            margin-top: 0.45vh;
            height: 1.95vh;
            opacity: 0;
            transform: translateY(1vh);
            transition: opacity 0.3s cubic-bezier(0.4, 0, 0.2, 1), 
                       transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        #menu-footer.visible {
            opacity: 1;
            transform: translateY(0);
        }

        #menu-footer.hiding {
            opacity: 0;
            transform: translateY(1vh);
        }

        #footer-left {
            font-weight: 500;
            display: flex;
            align-items: center;
        }

        #footer-right {
            font-weight: 500;
            font-family: monospace;
            color: ${mainColor};
        }

            position: absolute;
            right: 0.3vh;
            top: 0;
            width: 0.35vh;
            height: 100%;
            opacity: 0;
            z-index: 10;
            transition: opacity 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        #menu-scrollbar.visible {
            opacity: 1;
        }

        #menu-scrollbar.hiding {
            opacity: 0;
        }

        #scrollbar-track {
            width: 100%;
            height: 100%;
            background-color: rgba(255, 255, 255, 0.05);
            border-radius: 0.2vh;
            position: relative;
        }

        #scrollbar-thumb {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            background-color: rgba(${mainColorRGB.r}, ${mainColorRGB.g}, ${mainColorRGB.b}, 0.5);
            border-radius: 0.2vh;
            transition: top 0.25s ease-out, height 0.25s ease-out;
            min-height: 1.5vh;

    function hoveringTextClamp(value, min, max) {
        return Math.max(min, Math.min(max, value));

    function hoveringTextWrapIndex(index) {
        return hoveringTextItems.length ? ((index % hoveringTextItems.length + hoveringTextItems.length) % hoveringTextItems.length) : 0;

    function hoveringTextFindNearestIndex(prevId) {
        if (!hoveringTextItems.length) return 0;
        const idx = hoveringTextItems.findIndex(it => it.dataset.id === prevId);
        if (idx >= 0) return idx;
        return hoveringTextClamp(hoveringTextSelectedIndex, 0, hoveringTextItems.length - 1);

        const prevSelectedId = preserveSelectedId ?? (hoveringTextItems[hoveringTextSelectedIndex] && hoveringTextItems[hoveringTextSelectedIndex].dataset.id);
        hoveringTextListEl.innerHTML = '';

        hoveringTextOptions.forEach((opt, i) => {
            const li = document.createElement('li');
            li.className = 'hovering-text-item';
            li.dataset.id = String(opt.id);

            let fullData;
            if (opt.data && opt.data.trim() !== '') {

                fullData = `${opt.name}`;

            li.dataset.data = fullData;

            hoveringTextListEl.appendChild(li);

        hoveringTextItems = Array.from(hoveringTextListEl.querySelectorAll('.hovering-text-item'));
        hoveringTextSelectedIndex = hoveringTextFindNearestIndex(prevSelectedId);

    function hoveringTextUpdateMask() {
        const scrollTop = hoveringTextListEl.scrollTop;
        const scrollHeight = hoveringTextListEl.scrollHeight;
        const clientHeight = hoveringTextListEl.clientHeight;
        const scrollBottom = scrollHeight - scrollTop - clientHeight;
        const fadeDistance = 50;
        const topFadeAmount = Math.min(scrollTop / fadeDistance, 1);
        const bottomFadeAmount = Math.min(scrollBottom / fadeDistance, 1);
        const topFade = topFadeAmount * 15;
        const bottomFade = 100 - (bottomFadeAmount * 15);
        const safeTopFade = Math.min(topFade, bottomFade - 5);
        const safeBottomFade = Math.max(bottomFade, topFade + 5);
        const gradient = `linear-gradient(to bottom, transparent 0%, black ${safeTopFade}%, black ${safeBottomFade}%, transparent 100%)`;
        
        hoveringTextListEl.style.maskImage = gradient;
        hoveringTextListEl.style.webkitMaskImage = gradient;

            behavior: 'smooth',
            block: 'center'
        });
    };
 
    function hoveringTextUpdateSelection() {
        if (!hoveringTextItems.length) {
            hoveringTextSelectedIndex = 0;
            hoveringTextListEl.innerHTML = '';
            return;
        }

        hoveringTextItems.forEach((it, i) => {
            const isSelected = i === hoveringTextSelectedIndex;
            it.classList.toggle('hovering-text-selected', isSelected);
            it.classList.toggle('hovering-text-inactive', !isSelected);

            if (isSelected) {
                const data = it.dataset.data;
                const hasParentheses = data.includes('(');

                if (hasParentheses) {
                    const coloredText = data.replace(/\(([^)]+)\)/g, `(<span style="color: ${mainColor};">$1</span>)`);
                    it.innerHTML = `<span style="color: #fff;">${coloredText}</span>`;
                } else {
                    it.innerHTML = `<span style="color: ${mainColor};">${data}</span>`;

            }
        });
        
        hoveringTextScrollToSelected();
        setTimeout(hoveringTextUpdateMask, 50);
    };

    window.showNotification = function(setType = '', header = '', message = '', duration = 5000) {
        let setColor = typeColors[setType.toLowerCase()] || mainColor;

            } else if (data.position.right !== undefined && data.position.right !== null) {
                container.style.right = data.position.right;

        if (data.visible !== undefined) {

    window.setWatermark = function(data) {

            if (segment.label) {

                labelEl.className = 'watermark-label';
                labelEl.textContent = segment.label;

                segmentEl.appendChild(labelEl);
            }

            const valueEl = document.createElement('span');
            valueEl.className = 'watermark-value';

            if (segment.dynamic) {

                valueEl.textContent = watermarkDynamicValue(segment.dynamic);
            } else {
                valueEl.textContent = segment.value !== undefined && segment.value !== null ? String(segment.value) : '';

            segmentEl.appendChild(valueEl);
            container.appendChild(segmentEl);

        if (data.position) {
            if (data.position.centered) {
                container.classList.add('centered');
                container.style.left = '50%';
                container.style.right = 'auto';
            } else {
                container.classList.remove('centered');

                    container.style.right = data.position.right;
                    container.style.left = 'auto';
                }
            }

            if (data.position.top !== undefined && data.position.top !== null) {
                container.style.top = data.position.top;
                container.style.bottom = 'auto';
            } else if (data.position.bottom !== undefined && data.position.bottom !== null) {
                container.style.bottom = data.position.bottom;
                container.style.top = 'auto';
            }
        }

        if (data.visible && segments.length > 0) {
            setTimeout(() => {
                container.classList.add('visible');

            if (!watermarkTicker) {
                watermarkTicker = setInterval(tickWatermark, 1000);

    window.updateTooltip = function(tooltipData) {
        if (!tooltipData || tooltipData.length === 0) {
            tooltipContainer.classList.add('hiding');
            tooltipContainer.classList.remove('visible');
            
            setTimeout(() => {
                if (tooltipContainer.classList.contains('hiding')) {
                    tooltipContainer.style.display = 'none';
                    tooltipContainer.classList.remove('hiding');
                }
            }, 300);
            return;
        }

        if (tooltipContainer.classList.contains('hiding')) {
            tooltipContainer.classList.remove('hiding');
        }

        if (tooltipContainer.style.display === 'none') {
            tooltipContainer.style.display = 'block';
            tooltipContainer.offsetHeight;
        }

        const existingItems = tooltipContainer.querySelectorAll('.tooltip-item');
        const needsRebuild = existingItems.length !== tooltipData.length;

        if (needsRebuild) {
            tooltipContainer.innerHTML = '';
            tooltipData.forEach(item => {
                const itemEl = document.createElement('div');
                itemEl.className = 'tooltip-item';
                
                const labelEl = document.createElement('span');
                labelEl.className = 'tooltip-label';
                labelEl.textContent = item.label;
                
                const valueContainer = document.createElement('div');
                valueContainer.className = 'tooltip-value-container';
                
                if (item.icon) {
                    const iconEl = document.createElement('img');
                    iconEl.className = 'tooltip-icon';
                    iconEl.src = item.icon;
                    iconEl.alt = item.label || 'Tooltip icon';
                    iconEl.onerror = function() {
                        this.style.visibility = 'hidden';
                        this.style.width = '1.9vh';
                        this.style.height = '1.9vh';
                    };
                    valueContainer.appendChild(iconEl);
                } else {
                    const placeholderEl = document.createElement('div');
                    placeholderEl.style.width = '1.9vh';
                    placeholderEl.style.height = '1.9vh';
                    placeholderEl.style.flexShrink = '0';
                    placeholderEl.style.visibility = 'hidden';
                    placeholderEl.style.order = '-1';
                    valueContainer.appendChild(placeholderEl);
                }
                
                const valueEl = document.createElement('span');
                valueEl.className = 'tooltip-value';
                
                if (typeof item.text === 'object' && item.text !== null) {
                    valueEl.textContent = item.text.value !== undefined ? item.text.value : '';
                    valueEl.style.color = item.text.color || 'rgba(255, 255, 255, 0.85)';
                } else {
                    valueEl.textContent = item.text !== undefined ? item.text : (item.value !== undefined ? item.value : '');
                    valueEl.style.color = 'rgba(255, 255, 255, 0.85)';
                }

                valueContainer.appendChild(valueEl);
                
                if (item.bar) {
                    const barEl = document.createElement('div');
                    barEl.className = 'tooltip-bar';
                    
                    const barFillEl = document.createElement('div');
                    barFillEl.className = 'tooltip-bar-fill';
                    barFillEl.style.backgroundColor = item.bar.color || '#ffffff';
                    barFillEl.style.height = Math.max(0, Math.min(100, item.bar.percent || 0)) + '%';
                    
                    barEl.appendChild(barFillEl);
                    valueContainer.appendChild(barEl);
                }
                
                if (item.image) {
                    const imageEl = document.createElement('img');
                    imageEl.className = 'tooltip-image';
                    imageEl.src = item.image;
                    imageEl.alt = item.label || 'Tooltip image';
                    imageEl.onerror = function() {
                        this.style.display = 'none';
                    };

                    valueContainer.appendChild(imageEl);
                }
                
                itemEl.appendChild(labelEl);
                itemEl.appendChild(valueContainer);
                tooltipContainer.appendChild(itemEl);
            });
        } else {
            existingItems.forEach((itemEl, index) => {
                if (index >= tooltipData.length) return;
                const item = tooltipData[index];
                
                const valueContainer = itemEl.querySelector('.tooltip-value-container');
                if (!valueContainer) return;
                
                const valueEl = itemEl.querySelector('.tooltip-value');
                if (valueEl) {
                    if (typeof item.text === 'object' && item.text !== null) {
                        valueEl.textContent = item.text.value !== undefined ? item.text.value : '';
                        valueEl.style.color = item.text.color || 'rgba(255, 255, 255, 0.85)';
                    } else {
                        valueEl.textContent = item.text !== undefined ? item.text : (item.value !== undefined ? item.value : '');
                        valueEl.style.color = 'rgba(255, 255, 255, 0.85)';
                    }
                }
                
                const barFillEl = itemEl.querySelector('.tooltip-bar-fill');
                if (barFillEl && item.bar) {
                    barFillEl.style.backgroundColor = item.bar.color || '#ffffff';
                    barFillEl.style.height = Math.max(0, Math.min(100, item.bar.percent || 0)) + '%';
                }
                
                let iconEl = valueContainer.querySelector('.tooltip-icon');
                let placeholderEl = valueContainer.querySelector('div[style*="visibility: hidden"]');
                
                if (item.icon) {
                    if (!iconEl) {
                        if (placeholderEl) {
                            placeholderEl.remove();
                        }
                        iconEl = document.createElement('img');
                        iconEl.className = 'tooltip-icon';
                        iconEl.alt = item.label || 'Tooltip icon';
                        iconEl.onerror = function() {
                            this.style.visibility = 'hidden';
                            this.style.width = '1.9vh';
                            this.style.height = '1.9vh';
                        };
                        valueContainer.insertBefore(iconEl, valueContainer.firstChild);
                    }
                    iconEl.src = item.icon;
                    iconEl.style.visibility = 'visible';
                } else {
                    if (iconEl) {
                        iconEl.remove();
                    }

                    if (!placeholderEl) {
                        placeholderEl = document.createElement('div');
                        placeholderEl.style.width = '1.9vh';
                        placeholderEl.style.height = '1.9vh';
                        placeholderEl.style.flexShrink = '0';
                        placeholderEl.style.visibility = 'hidden';
                        placeholderEl.style.order = '-1';
                        valueContainer.insertBefore(placeholderEl, valueContainer.firstChild);
                    }
                }
                
                const imageEl = itemEl.querySelector('.tooltip-image');
                if (item.image) {
                    if (imageEl) {
                        if (imageEl.src !== item.image) {
                            imageEl.src = item.image;
                        }
                        imageEl.style.display = 'block';
                    } else {
                        const newImageEl = document.createElement('img');
                        newImageEl.className = 'tooltip-image';
                        newImageEl.src = item.image;
                        newImageEl.alt = item.label || 'Tooltip image';
                        newImageEl.onerror = function() {
                            this.style.display = 'none';
                        };
                        valueContainer.appendChild(newImageEl);
                    }
                } else if (imageEl) {
                    imageEl.remove();
                }
            });
        }

        try {
            if (!tooltipContainer.classList.contains('visible')) {
                requestAnimationFrame(() => {
                    tooltipContainer.classList.add('visible');
                });
            }
        } catch (error) {}
    };

    window.updateHelpMessage = function(helpMessageData) {

            helpMessage.textContent = helpMessageData;
            
            if (!helpMessageContainer.classList.contains('visible')) {

                    helpMessageContainer.classList.remove('hiding');

    window.showMenu = function() {
        const menuRoot = document.getElementById('menu-root');
        const headerWrapper = document.getElementById('header-wrapper');
        const menuContainer = document.getElementById('menu-container');
        const menuFooter = document.getElementById('menu-footer');
        const scrollbar = document.getElementById('menu-scrollbar');
        
        if (window.hideMenuTimeout) {
            clearTimeout(window.hideMenuTimeout);
            window.hideMenuTimeout = null;
        }
        
        const isMenuHidden = menuRoot.style.display === 'none' || !menuRoot.classList.contains('visible');
        
        if (isMenuHidden) {
            [menuRoot, headerWrapper, menuContainer, menuFooter, scrollbar].forEach(el => {
                if (el) {
                    el.classList.remove('hiding', 'visible');
                }
            });
            
            menuRoot.style.display = 'block';
            menuRoot.offsetHeight;
            
            requestAnimationFrame(() => {
                menuRoot.classList.add('visible');
                
                if (headerWrapper) {
                    setTimeout(() => headerWrapper.classList.add('visible'), 50);
                }

                if (menuContainer) {
                    setTimeout(() => menuContainer.classList.add('visible'), 100);
                }

                if (menuFooter) {
                    setTimeout(() => menuFooter.classList.add('visible'), 150);
                }
                
                if (scrollbar) {
                    setTimeout(() => scrollbar.classList.add('visible'), 100);
                }
            });

            window.updateSelection(currentSelectionIndex);
        } else {
            [menuRoot, headerWrapper, menuContainer, menuFooter].forEach(el => {
                if (el) {
                    el.classList.remove('hiding');
                    if (!el.classList.contains('visible')) {
                        el.classList.add('visible');
                    }
                }
            });
            
            if (scrollbar) {
                scrollbar.classList.remove('hiding');

                if (!scrollbar.classList.contains('visible')) {
                    scrollbar.classList.add('visible');
                }
            }
        }
    };

    window.hideMenu = function() {
        const menuRoot = document.getElementById('menu-root');
        const headerWrapper = document.getElementById('header-wrapper');
        const menuContainer = document.getElementById('menu-container');
        const menuFooter = document.getElementById('menu-footer');
        const menuScrollbar = document.getElementById('menu-scrollbar');
        
        if (window.hideMenuTimeout) {
            clearTimeout(window.hideMenuTimeout);
            window.hideMenuTimeout = null;
        }
        
        [menuRoot, headerWrapper, menuContainer, menuFooter, menuScrollbar].forEach(el => {
            if (el) {
                el.classList.remove('visible');
                el.classList.add('hiding');
            }
        });
        
        window.hideMenuTimeout = setTimeout(() => {
            if (menuRoot && menuRoot.classList.contains('hiding')) {
                [menuRoot, headerWrapper, menuContainer, menuFooter, menuScrollbar].forEach(el => {
                    if (el) {
                        el.classList.remove('hiding', 'visible');
                    }
                });
            }
            window.hideMenuTimeout = null;
        }, 300);
    };

    window.buildMenu = function(config) {
        currentMenuConfig = config;
        const tabs = config.tabs || [{ label: 'Main', options: config.options || [] }];

        tabsContainer.innerHTML = '';
        if (tabs.length > 0) {
            tabs.forEach((tab, index) => {
                const tabEl = document.createElement('div');
                tabEl.className = 'tab-item';

                if (tabs.length === 1) {
                    tabEl.classList.add('single');
                }

                tabEl.textContent = tab.label;
                tabEl.dataset.index = index;
                tabsContainer.appendChild(tabEl);
            });
        }

        const menuRoot = document.getElementById('menu-root');
        const headerWrapper = document.getElementById('header-wrapper');
        const menuContainer = document.getElementById('menu-container');
        const menuFooter = document.getElementById('menu-footer');
        const scrollbar = document.getElementById('menu-scrollbar');

        menuRoot.style.display = 'block';

        [menuRoot, headerWrapper, menuContainer, menuFooter, scrollbar].forEach(el => {
            if (el) {
                el.classList.remove('visible', 'hiding');
            }
        });

        menuRoot.offsetHeight;

        /* render tab 0 items BEFORE showing, so items are visible immediately */
        window.currentTabIndex = 0;
        window.updateTab(0);

        setTimeout(() => {
            window.showMenu();
        }, 10);

    window.updateMenuData = function(menuData) {
        currentMenuConfig = menuData;
        
        const tabsContainer = document.getElementById('menu-tabs');
        if (tabsContainer && menuData.tabs) {
            const currentTabCount = tabsContainer.children.length;

            if (currentTabCount !== menuData.tabs.length) {
                tabsContainer.innerHTML = '';

                if (menuData.tabs.length > 0) {
                    menuData.tabs.forEach((tab, index) => {
                        const tabEl = document.createElement('div');
                        tabEl.className = 'tab-item';
                        if (menuData.tabs.length === 1) {
                            tabEl.classList.add('single');
                        }
                        tabEl.textContent = tab.label;
                        tabEl.dataset.index = index;
                        tabsContainer.appendChild(tabEl);
                    });
                }
            } else {
                Array.from(tabsContainer.children).forEach((tabEl, index) => {
                    if (menuData.tabs[index]) {
                        tabEl.textContent = menuData.tabs[index].label;
                    }
                });
            }
        }
        
        updateCurrentTabItems();
    };

    window.updateTab = function(tabIndex) {
        window.currentTabIndex = tabIndex;
        
        const menuRoot = document.getElementById('menu-root');
        const headerWrapper = document.getElementById('header-wrapper');
        const menuContainer = document.getElementById('menu-container');
        const menuFooter = document.getElementById('menu-footer');
        const scrollbar = document.getElementById('menu-scrollbar');
        
        if (window.hideMenuTimeout) {
            clearTimeout(window.hideMenuTimeout);
            window.hideMenuTimeout = null;
        }
        
        [menuRoot, headerWrapper, menuContainer, menuFooter, scrollbar].forEach(el => {
            if (el) {
                el.classList.remove('hiding');
                el.classList.add('visible');
            }
        });
        
        const tabs = currentMenuConfig.tabs || [{ label: 'Main', options: currentMenuConfig.options || [] }];
        const currentTab = tabs[tabIndex];
        let options = [];

        if (currentTab) {
            options = currentTab.options || [];
        }

        menuConfig = options;

        const tabElements = tabsContainer.querySelectorAll('.tab-item');
        tabElements.forEach((el, index) => {
            if (index === tabIndex) {
                el.classList.add('active');
            } else {
                el.classList.remove('active');
            }
        });

        buildItemsForTab(options);
        
        currentSelectionIndex = 0;
        const firstValidIndex = findFirstValidItem(options);
        if (firstValidIndex !== -1) {
            currentSelectionIndex = firstValidIndex;
        }

        scrollOffset = 0;
        itemsList.style.transform = 'translateY(0px)';
        
        updateFooterInfo();
    };

    window.buildItemsForTab = function(options) {
        itemsList.innerHTML = '';
        
        options.forEach((option, index) => {
            const item = document.createElement('div');
            item.className = 'menu-item';
            item.dataset.index = index;
            
            if (option.separator) {
                item.classList.add('separator');
                const separatorContainer = document.createElement('div');
                separatorContainer.className = 'separator-container';
                
                const leftBar = document.createElement('div');
                leftBar.className = 'separator-bar';
                
                const text = document.createElement('div');
                text.className = 'separator-text';
                text.textContent = option.name || '';
                
                const rightBar = document.createElement('div');
                rightBar.className = 'separator-bar';
                
                separatorContainer.appendChild(leftBar);

                if (option.name) {
                    separatorContainer.appendChild(text);
                }

                separatorContainer.appendChild(rightBar);
                
                item.appendChild(separatorContainer);
            } else {
                const nameContainer = document.createElement('div');
                nameContainer.className = 'name-container';

                if (option.navIcon) {
                    const navIconEl = document.createElement('span');
                    navIconEl.className = 'menu-item-icon';
                    navIconEl.dataset.icon = option.navIcon;
                    navIconEl.innerHTML = lucideIconSvg(option.navIcon);
                    nameContainer.appendChild(navIconEl);
                }

                const nameSpan = document.createElement('span');
                nameSpan.className = 'name';
                nameSpan.textContent = option.name || '';
                nameContainer.appendChild(nameSpan);
                item.appendChild(nameContainer);

                const componentsContainer = document.createElement('div');
                componentsContainer.className = 'components-container';

                if (option.icon) {
                    const iconComponent = document.createElement('div');
                    iconComponent.className = 'component icon';
                    const iconImg = document.createElement('img');
                    iconImg.className = 'icon-image';
                    iconImg.src = option.icon;
                    iconComponent.appendChild(iconImg);
                    componentsContainer.appendChild(iconComponent);
                }

                if (option.range) {
                    const rangeComponent = document.createElement('div');
                    rangeComponent.className = 'component';
                    const rangeContainer = document.createElement('div');
                    rangeContainer.className = 'range-component';
                    
                    const rangeValue = document.createElement('div');
                    rangeValue.className = 'range-value';
                    rangeValue.textContent = option.range.value || 0;
                    
                    const rangeTrack = document.createElement('div');
                    rangeTrack.className = 'range-track';
                    
                    const rangeFill = document.createElement('div');
                    rangeFill.className = 'range-fill';
                    const percent = ((option.range.value - option.range.min) / (option.range.max - option.range.min)) * 100;
                    rangeFill.style.width = percent + '%';
                    
                    const rangeInput = document.createElement('input');
                    rangeInput.type = 'range';
                    rangeInput.min = option.range.min || 0;
                    rangeInput.max = option.range.max || 100;
                    rangeInput.step = option.range.step || 1;
                    rangeInput.value = option.range.value || 0;
                    
                    rangeContainer.appendChild(rangeValue);
                    rangeContainer.appendChild(rangeTrack);
                    rangeContainer.appendChild(rangeFill);
                    rangeContainer.appendChild(rangeInput);
                    rangeComponent.appendChild(rangeContainer);
                    componentsContainer.appendChild(rangeComponent);
                }
                
                if (option.slider) {
                    const sliderComponent = document.createElement('div');
                    sliderComponent.className = 'component';
                    const sliderContainer = document.createElement('div');
                    sliderContainer.className = 'slider-component';
                    
                    const sliderValue = document.createElement('span');
                    const currentOption = option.slider.options.find(opt => opt.value === option.slider.value);
                    sliderValue.textContent = currentOption ? currentOption.label : '';
                    
                    sliderContainer.appendChild(sliderValue);
                    sliderComponent.appendChild(sliderContainer);
                    componentsContainer.appendChild(sliderComponent);
                }

                if (option.checkbox) {
                    const checkboxComponent = document.createElement('div');
                    checkboxComponent.className = 'component';
                    const checkbox = document.createElement('input');
                    checkbox.type = 'checkbox';
                    checkbox.checked = option.checkbox.checked || false;
                    checkbox.disabled = option.checkbox.locked || false;
                    checkboxComponent.appendChild(checkbox);
                    componentsContainer.appendChild(checkboxComponent);
                }
                
                if (option.button) {
                    const buttonComponent = document.createElement('div');
                    buttonComponent.className = 'component';
                    const button = document.createElement('button');
                    button.textContent = option.button.label || '';
                    buttonComponent.appendChild(button);
                    componentsContainer.appendChild(buttonComponent);
                }
                
                item.appendChild(componentsContainer);
            }
            
            itemsList.appendChild(item);
        });
    };

    window.updateFooterInfo = function() {
        const footerRight = document.getElementById('footer-right');
        if (footerRight && menuConfig) {
            let totalOptions = 0;
            for (let i = 0; i < menuConfig.length; i++) {
                if (!menuConfig[i].separator) {
                    totalOptions++;
                }
            }
            
            let currentOptionNumber = 0;
            for (let i = 0; i <= currentSelectionIndex && i < menuConfig.length; i++) {
                if (!menuConfig[i].separator) {
                    currentOptionNumber++;
                }
            }
            
            footerRight.textContent = `${currentOptionNumber}/${totalOptions}`;
        }
    };

    window.findFirstValidItem = function(options) {
        for (let i = 0; i < options.length; i++) {
            if (!options[i].separator) {
                return i;
            }
        }
        return 0;
    };

    window.updateCurrentTabItems = function() {
        if (!currentMenuConfig || !currentMenuConfig.tabs) return;
        
        const currentTabData = currentMenuConfig.tabs[window.currentTabIndex || 0];
        if (!currentTabData) return;
        
        const options = currentTabData.options || [];
        
        buildItemsForTab(options);
        
        menuConfig = options;
        
        updateFooterInfo();
    };

    window.updateLiveTabContent = function(options, selectionIndex) {
        menuConfig = options;
        
        const currentItemElements = itemsList.querySelectorAll('.menu-item');
        const currentCount = currentItemElements.length;
        const newCount = options.length;
        
        let needsRebuild = currentCount !== newCount;
        
        if (!needsRebuild && currentCount > 0) {
            for (let i = 0; i < Math.min(currentCount, newCount); i++) {

        if (!rangeInput) return;

        const rangeValue = itemEl.querySelector('.range-value');

            const min = parseFloat(rangeInput.min);
            const max = parseFloat(rangeInput.max);
            const val = parseFloat(rangeInput.value);
            const percentage = ((val - min) * 100) / (max - min);
            rangeFill.style.width = `${percentage}%`;
            rangeValue.textContent = val.toFixed(val % 1 === 0 ? 0 : 2);
            const thumbWidth = 14;
            const trackWidth = rangeInput.offsetWidth;
            const thumbPosition = (percentage / 100) * (trackWidth - thumbWidth) + (thumbWidth / 2);
            rangeValue.style.left = `${thumbPosition}px`;
            
            if (itemEl.classList.contains('highlighted')) {
                const nameSpan = itemEl.querySelector('span:first-child');

        }
    }

    window.updateSelection = function(selectionIndex) {
        currentSelectionIndex = selectionIndex;

        requestAnimationFrame(() => {
            const itemElements = itemsList.querySelectorAll('.menu-item');
            if (itemElements.length === 0 || currentSelectionIndex < 0 || currentSelectionIndex >= itemElements.length) {
                selectionHighlight.style.display = 'none';
                return;
            }

            selectionHighlight.style.display = 'block';

            let currentOptionNumber = 0;
            let totalOptions = 0;
            
            for (let i = 0; i < menuConfig.length; i++) {
                if (!menuConfig[i].separator) {
                    totalOptions++;
                }
            }
            
            for (let i = 0; i <= currentSelectionIndex; i++) {
                if (i < menuConfig.length && !menuConfig[i].separator) {
                    currentOptionNumber++;
                }
            }
            
            const footerRight = document.getElementById('footer-right');
            if (footerRight) {
                footerRight.textContent = `${currentOptionNumber}/${totalOptions}`;
            }

            const menuItemsContainer = document.getElementById('menu-items');
            const selectedElement = itemElements[currentSelectionIndex];

            let itemHeightPx = 0;
            if (selectedElement) {
                itemHeightPx = selectedElement.offsetHeight;
            } else if (itemElements.length > 0) {
                itemHeightPx = itemElements[0].offsetHeight;
            }

            if (itemHeightPx === 0 && menuItemsContainer && itemElements.length > 0) {
                itemHeightPx = menuItemsContainer.offsetHeight / itemElements.length;
            }

            const containerHeightPx = menuItemsContainer ? menuItemsContainer.offsetHeight : 0;
            const maxVisibleItems = (containerHeightPx > 0 && itemHeightPx > 0) ? Math.floor(containerHeightPx / itemHeightPx) : itemElements.length;
            const totalItems = itemElements.length;
            const selectedElementTop = selectedElement ? selectedElement.offsetTop : (currentSelectionIndex * itemHeightPx);

            let selectedElementBottom;
            if (selectedElement) {
                const nextElement = itemElements[currentSelectionIndex + 1];
                if (nextElement) {
                    selectedElementBottom = nextElement.offsetTop;
                } else {
                    selectedElementBottom = selectedElement.offsetTop + selectedElement.offsetHeight;
                }
            } else {
                selectedElementBottom = selectedElementTop + itemHeightPx;
            }

            const visibleTop = scrollOffset;
            const visibleBottom = scrollOffset + containerHeightPx;

            if (selectedElementTop < visibleTop) {
                scrollOffset = selectedElementTop;
            } else if (selectedElementBottom > visibleBottom) {
                scrollOffset = selectedElementBottom - containerHeightPx;
            }

            let maxScroll = 0;
            if (itemElements.length > 0) {
                const lastElement = itemElements[itemElements.length - 1];
                const lastElementBottom = lastElement.offsetTop + lastElement.offsetHeight;
                maxScroll = Math.max(0, lastElementBottom - containerHeightPx);
            }

            scrollOffset = Math.max(0, Math.min(scrollOffset, maxScroll));

            itemsList.style.transform = `translateY(-${scrollOffset}px)`;

            if (selectedElement) {
                const highlightTop = selectedElementTop - scrollOffset;
                selectionHighlight.style.top = `${highlightTop}px`;
            }

            const menuScrollbar = document.getElementById('menu-scrollbar');
            if (totalItems > maxVisibleItems) {
                const totalContentHeightPx = totalItems * itemHeightPx;

                const scrollbarTrack = document.getElementById('scrollbar-track');
                scrollbarTrack.style.height = `${containerHeightPx}px`;

                const thumbHeightPx = Math.max(20, (containerHeightPx / totalContentHeightPx) * containerHeightPx);

                const maxThumbTop = containerHeightPx - thumbHeightPx;
                const scrollPercentage = maxScroll > 0 ? scrollOffset / maxScroll : 0;
                const thumbTopPx = scrollPercentage * maxThumbTop;

                scrollbarThumb.style.height = `${thumbHeightPx}px`;
                scrollbarThumb.style.top = `${thumbTopPx}px`;
                if (menuScrollbar) menuScrollbar.style.display = '';
            } else {
                /* hide scrollbar entirely when all items fit */
                if (menuScrollbar) menuScrollbar.style.display = 'none';
            }
        });
    };

    window.updateProgressBar = function(percent, topText, bottomText) {
        const progressBar = document.getElementById('progress-bar');
        const percentTextEl = document.getElementById('progress-percent-text');
        const topTextEl = document.getElementById('progress-top-text');
        const bottomTextEl = document.getElementById('progress-bottom-text');
        
        if (progressBar) {
            progressBar.style.width = percent + '%';
        }
        
        if (percentTextEl) {
            const currentPercent = parseInt(percentTextEl.textContent) || 0;
            const targetPercent = Math.floor(percent);
            
            if (currentPercent !== targetPercent) {
                const step = currentPercent < targetPercent ? 1 : -1;
                let animPercent = currentPercent;
                
                const animatePercent = () => {
                    if ((step > 0 && animPercent < targetPercent) || (step < 0 && animPercent > targetPercent)) {
                        animPercent += step;
                        percentTextEl.textContent = animPercent + '%';
                        requestAnimationFrame(animatePercent);
                    } else {
                        percentTextEl.textContent = targetPercent + '%';
                    }
                };
                
                animatePercent();
            }
        }
        
        if (topText && topTextEl) {
            topTextEl.textContent = topText;
        }
        
        if (bottomText && bottomTextEl) {
            bottomTextEl.innerHTML = bottomText;
        }
    };

    };

    };
