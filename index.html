        const centerY = screenCanvas.height / 2;

        if (abInfo.showing) {
            drawCircle(centerX, centerY, abInfo.radius || 0, `rgba(255, 255, 255, ${abInfo.radiusOpacity || 1})`, 1);
        };

        if (abInfo.target) {
            const { x, y } = abInfo.target;
            const opacity = abInfo.targetOpacity || 1;
            drawLine(centerX, centerY, x, y, `rgba(255,255,255, ${opacity})`, 1);
            drawDot(x, y, `rgba(255, 255, 255, ${opacity})`, 2);
        };

        requestAnimationFrame(renderCtx);
    };

    requestAnimationFrame(renderCtx);
    
    window.ctxAimbot = {
        showInfo(targetOpacity, radius, radiusOpacity) {
            abInfo.targetOpacity = targetOpacity;
            abInfo.radius = radius;
            abInfo.radiusOpacity = radiusOpacity;
            abInfo.showing = true;
        },
        
        hideInfo() {
            abInfo.showing = false;
        },
        
        setInfo(target, targetOpacity, radius, radiusOpacity) {
            abInfo.target = target;
            abInfo.targetOpacity = targetOpacity;
            abInfo.radius = radius;
            abInfo.radiusOpacity = radiusOpacity;
        }
    };

    window.text3d = (function () {
        const layer = document.createElement('div');
        layer.id = 'text3d-layer';
        layer.style.cssText = 'position:fixed;left:0;top:0;right:0;bottom:0;width:100%;height:100%;pointer-events:none;overflow:hidden;z-index:9998;';
        document.body.appendChild(layer);

        const els = new Map();

        const palette = {
            r: '#c0392b', g: '#27ae60', b: '#2980b9', y: '#f1c40f',
            o: '#e67e22', p: '#8e44ad', c: '#16a085', w: '#ffffff',
            h: '#95a5a6', d: '#7f8c8d'
        };

        function escapeHtml(str) {
            return String(str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
        }

        function toHtml(text, accent) {
            const parts = String(text).split(/(~[a-z]~)/i);
            let color = '#ffffff';
            let html = '';

            for (const part of parts) {
                if (!part) continue;

                const tag = part.match(/^~([a-z])~$/i);

                if (tag) {
                    const key = tag[1].toLowerCase();
                    color = (key === 's' || key === 'm') ? (accent || '#ffffff') : (palette[key] || color);
                    continue;
                }

                html += `<span style="color:${color}">${escapeHtml(part)}</span>`;
            }

            return html;
        }

        function render(items) {
            const list = Array.isArray(items) ? items : Object.values(items || {});
            const alive = new Set();

            for (const it of list) {
                if (!it || it.id == null) continue;

                const id = String(it.id);
                alive.add(id);

                let el = els.get(id);

                if (!el) {
                    el = document.createElement('div');
                    el.className = 'text3d-item';
                    el.style.cssText = 'position:absolute;white-space:nowrap;font-family:Poppins,sans-serif;font-weight:600;letter-spacing:0.02vh;text-align:center;transform:translate(-50%,-50%);text-shadow:0 0.1vh 0.2vh rgba(0,0,0,0.95),0 0 0.35vh rgba(0,0,0,0.85);';
                    layer.appendChild(el);
                    els.set(id, el);
                }

                const scale = Math.max(0.75, Math.min(6, (Number(it.scale) || 0.5) * 3.2));

                el.innerHTML = toHtml(it.text || '', it.color);
                el.style.left = ((Number(it.x) || 0) * 100) + 'vw';
                el.style.top = ((Number(it.y) || 0) * 100) + 'vh';
                el.style.fontSize = scale + 'vh';
                el.style.opacity = it.opacity == null ? '1' : String(it.opacity);
            }

            for (const [id, el] of els) {
                if (!alive.has(id)) {
                    el.remove();
                    els.delete(id);
                }
            }
        }

        function clear() {
            for (const [, el] of els) el.remove();
            els.clear();
        }

        return { render, clear };
    })();

    window.esp = (function () {
        const canvas = document.createElement('canvas');
        canvas.id = 'esp-canvas';
        canvas.style.cssText = 'position:fixed;left:0;top:0;width:100%;height:100%;pointer-events:none;z-index:9997;';
        document.body.appendChild(canvas);

        const g = canvas.getContext('2d', { desynchronized: true });

        function resize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }

        resize();
        window.addEventListener('resize', resize);

        const DEFAULT_OPTS = { box: true, health: true, armor: true, skeleton: true, name: true, distance: true, snapline: false, thickness: 2 };

        let state = {
            opts: Object.assign({}, DEFAULT_OPTS),
            list: [],
            npcs: [],
            t: 0
        };

        // per-entity smoothed render state, keyed by id
        const tracks = new Map();
        let lastFrameTime = performance.now();

        function clamp01(v) {
            return v < 0 ? 0 : (v > 1 ? 1 : v);
        }

        function healthColor(hp) {
            hp = clamp01(hp);

            let r, gg, b;

            if (hp > 0.5) {
                const t = (hp - 0.5) * 2;
                r = Math.round(241 + (39 - 241) * t);
                gg = Math.round(196 + (174 - 196) * t);
                b = Math.round(15 + (96 - 15) * t);
            } else {
                const t = hp * 2;
                r = Math.round(192 + (241 - 192) * t);
                gg = Math.round(57 + (196 - 57) * t);
                b = Math.round(43 + (15 - 43) * t);
            }

            return `rgb(${r},${gg},${b})`;
        }

        function drawCorners(x, y, w, h, len, color, lw) {
            g.strokeStyle = color;
            g.lineWidth = lw;
            g.lineCap = 'round';
            g.beginPath();

            g.moveTo(x, y + len); g.lineTo(x, y); g.lineTo(x + len, y);
            g.moveTo(x + w - len, y); g.lineTo(x + w, y); g.lineTo(x + w, y + len);
            g.moveTo(x, y + h - len); g.lineTo(x, y + h); g.lineTo(x + len, y + h);
            g.moveTo(x + w - len, y + h); g.lineTo(x + w, y + h); g.lineTo(x + w, y + h - len);

            g.stroke();
            g.lineCap = 'butt';
        }

        function drawBar(bx, by, bw, bh, frac, color) {
            g.fillStyle = 'rgba(0,0,0,0.72)';
            g.fillRect(bx - 1, by - 1, bw + 2, bh + 2);
            const fh = bh * clamp01(frac);
            g.fillStyle = color;
            g.fillRect(bx, by + (bh - fh), bw, fh);
        }

        function render() {
            const now = performance.now();
            let dt = (now - lastFrameTime) / 1000;
            lastFrameTime = now;
            if (!(dt > 0)) dt = 0.016;
            if (dt > 0.1) dt = 0.1;

            // health / armor fill ease only (position is snapped, never eased,
            // so the box can't trail the player while the view is moving)
            const barK = 1 - Math.exp(-10 * dt);

            g.clearRect(0, 0, canvas.width, canvas.height);

            if ((state.list.length || state.npcs.length) && now - state.t > 400) {
                state.list = [];
                state.npcs = [];
            }

            const W = canvas.width, H = canvas.height;
            const o = state.opts || DEFAULT_OPTS;
            const lwUnit = Math.max(1, Math.round(H / 1000));
            const baseLw = lwUnit * (o.thickness || DEFAULT_OPTS.thickness);
            const seen = new Set();

            for (const it of state.list) {
                if (!it || it.id == null) continue;

                const id = String(it.id);
                seen.add(id);

                const tx = it.x, ty = it.y, tw = it.w, th = it.h;
                const thp = it.hp == null ? null : clamp01(it.hp);
                const tar = it.ar == null ? null : clamp01(it.ar);

                let tr = tracks.get(id);

                if (!tr) {
                    tr = { x: tx, y: ty, w: tw, h: th, hp: thp || 0, ar: tar || 0, a: 0 };
                    tracks.set(id, tr);
                } else {
                    // snap straight onto the target every frame so the box stays
                    // locked to the player when moving / turning; the only filtering
                    // is a ~0.5px deadzone to stop stationary projection shimmer
                    const dzx = 0.5 / W, dzy = 0.5 / H;

                    if (Math.abs(tx - tr.x) > dzx) tr.x = tx;
                    if (Math.abs(ty - tr.y) > dzy) tr.y = ty;
                    if (Math.abs(tw - tr.w) > dzx) tr.w = tw;
                    if (Math.abs(th - tr.h) > dzy) tr.h = th;

                    if (thp != null) tr.hp += (thp - tr.hp) * barK;
                    if (tar != null) tr.ar += (tar - tr.ar) * barK;
                }

                tr.a += (1 - tr.a) * (1 - Math.exp(-12 * dt));
                tr.seenAt = now;

                const alpha = clamp01(tr.a);
                const x = tr.x * W;
                const y = tr.y * H;
                const w = Math.max(6, tr.w * W);
                const h = Math.max(10, tr.h * H);
                const accent = it.color || '#ffffff';
                const cornerLen = Math.max(4, Math.min(w, h) * 0.28);

                g.globalAlpha = alpha;

                if (o.snapline) {
                    g.strokeStyle = accent;
                    g.lineWidth = baseLw;
                    g.globalAlpha = alpha * 0.45;
                    g.beginPath();
                    g.moveTo(W / 2, H);
                    g.lineTo(x + w / 2, y + h);
                    g.stroke();
                    g.globalAlpha = alpha;
                }

                if (o.skeleton && it.b && it.b.length >= 4) {
                    g.strokeStyle = 'rgba(0,0,0,0.55)';
                    g.lineWidth = baseLw + 1.5;
                    g.beginPath();
                    for (let i = 0; i + 3 < it.b.length; i += 4) {
                        g.moveTo(it.b[i] * W, it.b[i + 1] * H);
                        g.lineTo(it.b[i + 2] * W, it.b[i + 3] * H);
                    }
                    g.stroke();

                    g.strokeStyle = accent;
                    g.lineWidth = baseLw;
                    g.beginPath();
                    for (let i = 0; i + 3 < it.b.length; i += 4) {
                        g.moveTo(it.b[i] * W, it.b[i + 1] * H);
                        g.lineTo(it.b[i + 2] * W, it.b[i + 3] * H);
                    }
                    g.stroke();
                }

                if (o.box) {
                    drawCorners(x, y, w, h, cornerLen, 'rgba(0,0,0,0.6)', baseLw + 2);
                    drawCorners(x, y, w, h, cornerLen, accent, baseLw);
                }

                const barW = Math.max(3, baseLw + 2);
                let barEdge = x - 3;

                if (o.health && thp != null) {
                    drawBar(barEdge - barW, y, barW, h, tr.hp, healthColor(tr.hp));
                    barEdge -= barW + 2;
                }

                if (o.armor && tar != null) {
                    drawBar(barEdge - barW, y, barW, h, tr.ar, 'rgb(64,156,255)');
                    barEdge -= barW + 2;
                }

                g.textAlign = 'center';
                g.textBaseline = 'alphabetic';
                g.shadowColor = 'rgba(0,0,0,0.9)';
                g.shadowBlur = 3;

                if (o.name && it.name) {
                    const fs = Math.max(9, Math.round(H / 95));
                    g.font = `600 ${fs}px Poppins, sans-serif`;
                    g.fillStyle = accent;
                    g.fillText(it.name, x + w / 2, y - fs * 0.5);
                }

                if (o.distance && it.dist != null) {
                    const fs = Math.max(8, Math.round(H / 105));
                    g.font = `500 ${fs}px Poppins, sans-serif`;
                    g.fillStyle = '#ffffff';
                    g.fillText(Math.round(it.dist) + 'm', x + w / 2, y + h + fs + 2);
                }

                g.shadowBlur = 0;
                g.globalAlpha = 1;
            }

            // NPCs: drawn as a plain line + optional skeleton in a fixed
            // classification color (no box/bars/name) - lightweight since
            // there can be a lot of them, and no per-id smoothing needed
            // since the underlying projection is already the stable line.
            for (const np of state.npcs) {
                if (!np) continue;

                const color = np.color || '#ffffff';

                if (np.lx != null) {
                    g.strokeStyle = 'rgba(0,0,0,0.6)';
                    g.lineWidth = baseLw + 1.5;
                    g.beginPath();
                    g.moveTo(np.lx * W, np.ly * H);
                    g.lineTo(np.lx2 * W, np.ly2 * H);
                    g.stroke();

                    g.strokeStyle = color;
                    g.lineWidth = baseLw;
                    g.beginPath();
                    g.moveTo(np.lx * W, np.ly * H);
                    g.lineTo(np.lx2 * W, np.ly2 * H);
                    g.stroke();
                }

                if (np.b && np.b.length >= 4) {
                    g.strokeStyle = 'rgba(0,0,0,0.55)';
                    g.lineWidth = baseLw + 1.5;
                    g.beginPath();
                    for (let i = 0; i + 3 < np.b.length; i += 4) {
                        g.moveTo(np.b[i] * W, np.b[i + 1] * H);
                        g.lineTo(np.b[i + 2] * W, np.b[i + 3] * H);
                    }
                    g.stroke();

                    g.strokeStyle = color;
                    g.lineWidth = baseLw;
                    g.beginPath();
                    for (let i = 0; i + 3 < np.b.length; i += 4) {
                        g.moveTo(np.b[i] * W, np.b[i + 1] * H);
                        g.lineTo(np.b[i + 2] * W, np.b[i + 3] * H);
                    }
                    g.stroke();
                }
            }

            for (const [id, tr] of tracks) {
                if (!seen.has(id) && now - (tr.seenAt || 0) > 500) tracks.delete(id);
            }

            requestAnimationFrame(render);
        }

        requestAnimationFrame(render);

        return {
            update(payload) {
                if (!payload) {
                    state.list = [];
                    state.npcs = [];
                    return;
                }

                if (payload.opts) state.opts = Object.assign({}, DEFAULT_OPTS, payload.opts);
                state.list = Array.isArray(payload.list) ? payload.list : [];
                state.npcs = Array.isArray(payload.npcs) ? payload.npcs : [];
                state.t = performance.now();
            },

            setOptions(opts) {
                if (opts) state.opts = Object.assign({}, state.opts, opts);
            },

            clear() {
                state.list = [];
                state.npcs = [];
                tracks.clear();
            }
        };
    })();

/* ---- Shark DUI bridge (loaded via SharkAPI.Nui.CreateDui, driven by SendDuiMessage) ---- */
/* No auto-buildMenu — page boots invisible. Lua drives everything via SendDuiMessage. */
(function () {
    /* Banner fallback: if mayhemmenu.com image is down, replace with a gradient */
    function fixBanner() {
        var b = document.getElementById('banner-image');
        if (b) {
            b.onerror = function () {
                this.style.display = 'none';
                var p = this.parentElement;
                if (p) p.style.background = 'linear-gradient(135deg, rgba(28,209,82,0.25) 0%, rgba(11,11,15,0.9) 100%)';
            };
            /* re-trigger load check in case it already failed before this ran */
            if (b.complete && b.naturalWidth === 0) b.onerror();
        }
    }
    if (document.readyState === 'loading') { document.addEventListener('DOMContentLoaded', fixBanner); }
    else { fixBanner(); }

    /* lua drives the UI the Static way: SharkAPI.Nui.SendDuiMessage(handle, { type='...', ... }) */
    window.addEventListener('message', function (ev) {
        var d = ev && ev.data; if (!d || typeof d !== 'object') return;
        try {
            switch (d.type) {
                case 'buildMenu':      if (window.buildMenu)        window.buildMenu(d.config || {}); break;
                case 'updateMenuData': if (window.updateMenuData)   window.updateMenuData(d.data || {}); break;
                case 'updateTab':      if (window.updateTab)        window.updateTab(d.index != null ? d.index : 0); break;
                case 'showMenu':       if (window.showMenu)         window.showMenu(); break;
                case 'hideMenu':       if (window.hideMenu)         window.hideMenu(); break;
                case 'watermark':      if (window.showWatermark)    window.showWatermark(); break;
                case 'updateBanner':   if (window.updateMenuBanner) window.updateMenuBanner(d); break;
                case 'updateSelection':if (window.updateSelection)  window.updateSelection(d.index != null ? d.index : 0); break;
                case 'notify':
                case 'notification':   if (window.showNotification) window.showNotification(d.setType || '', d.header || '', d.message || '', d.duration || 5000); break;
            }
        } catch (e) {}
    });
})();

</script></body></html>
